[package]
name = "commit-miner"
version = "0.0.1"
edition = "2024"
description = "Jev-powered commit classification with offline diff reports"
include = ["/src/*.rs", "/tests/*.rs", "/assets/*", "/skills/commit-miner/SKILL.md", "/examples/sample.html", "/README.md", "/docs/JEV_PROTOCOL.md", "/Cargo.toml", "/Cargo.lock"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
console = "0.16"
futures = "0.3"
httpdate = "1"
indicatif = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "fs", "signal", "sync", "time", "net"] }
tokio-util = "0.7"
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
